{{ define "main" }}
<div class="page-header">
  <h1>{{ .Title }}</h1>
</div>
<div class="blog-list">
  {{ .Content }}
  {{ range .Pages }}
  <div class="blog-item">
    <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
    <div class="meta">{{ .Date.Format "02 January 2006" }} {{ with .Params.category }}· {{ . }}{{ end }}</div>
    <p>{{ .Description }}</p>
    <a href="{{ .Permalink }}" class="read-more">Baca selengkapnya →</a>
  </div>
  {{ end }}
</div>
{{ end }}
