<header class="site-header">
  <div class="container header-inner">
    <a href="{{ .Site.BaseURL }}" class="logo">
      <span class="logo-icon">⚖️</span>
      <span class="logo-text">{{ .Site.Title }}</span>
    </a>
    <nav class="main-nav" id="mainNav">
      {{ range .Site.Menus.main }}
        {{ if eq .Name "Layanan" }}
      <div class="nav-item dropdown">
        <button class="nav-link dropdown-toggle">Layanan ▾</button>
        <div class="dropdown-menu">
          {{ range $.Site.Menus.services }}
          <a href="{{ .URL }}" class="dropdown-item">{{ .Params.icon }} {{ .Name }}</a>
          {{ end }}
        </div>
      </div>
        {{ else }}
      <a href="{{ .URL }}" class="nav-link{{ if $.IsHome }}{{ if eq .URL "/" }} active{{ end }}{{ else if eq $.RelPermalink .URL }} active{{ end }}{{ if .Params.cta }} nav-cta{{ end }}">{{ .Name }}</a>
        {{ end }}
      {{ end }}
    </nav>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
  </div>
</header>
<script>
  document.getElementById('mobileToggle').addEventListener('click', function() {
    document.getElementById('mainNav').classList.toggle('open');
  });
</script>
