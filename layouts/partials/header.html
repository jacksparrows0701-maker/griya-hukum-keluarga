<header class="site-header">
  <div class="container header-inner">
    <a href="{{ .Site.BaseURL }}" class="logo">
      <span class="logo-icon">⚖️</span>
      <span class="logo-text">{{ .Site.Title }}</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="{{ .Site.BaseURL }}" class="nav-link{{ if .IsHome }} active{{ end }}">Beranda</a>
      <div class="nav-item dropdown">
        <button class="nav-link dropdown-toggle">Layanan ▾</button>
        <div class="dropdown-menu">
          {{ range .Site.Params.services.items }}
          <a href="{{ .slug | absURL }}" class="dropdown-item">{{ .icon }} {{ .title }}</a>
          {{ end }}
        </div>
      </div>
      <a href="{{ "tentang" | absURL }}" class="nav-link{{ if eq .RelPermalink "/tentang/" }} active{{ end }}">Tentang Kami</a>
      <a href="{{ "blog" | absURL }}" class="nav-link{{ if eq .Section "blog" }} active{{ end }}">Artikel</a>
      <a href="{{ "konsultasi" | absURL }}" class="nav-link nav-cta{{ if eq .RelPermalink "/konsultasi/" }} active{{ end }}">Konsultasi</a>
    </nav>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
  </div>
</header>
<script>
  document.getElementById('mobileToggle').addEventListener('click', function() {
    document.getElementById('mainNav').classList.toggle('open');
  });
</script>
